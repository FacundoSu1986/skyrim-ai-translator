<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Skyrim AI Translator">
  <title>Skyrim AI Translator</title>
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="32" y1="8" x2="32" y2="56">
      <stop offset="0" stop-color="#fff2c2"/>
      <stop offset="0.55" stop-color="#dfb758"/>
      <stop offset="1" stop-color="#9a7330"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1218"/>
      <stop offset="1" stop-color="#030507"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#stone)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="10" fill="none"
        stroke="#9a7330" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Escudo nordico -->
  <path d="M32 8 L52 15 V32 C52 43.5 43.2 51.8 32 56 C20.8 51.8 12 43.5 12 32 V15 Z"
        fill="none" stroke="url(#gold)" stroke-width="2.6"
        stroke-linejoin="round"/>

  <!-- Runa Tiwaz: eje vertical + astas -->
  <path d="M32 19 V45" stroke="url(#gold)" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M23 28 L32 18 L41 28" fill="none" stroke="url(#gold)"
        stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Doble chevron: el paso de un idioma a otro -->
  <path d="M24.5 38 L28.5 42 L24.5 46" fill="none" stroke="#6fe3ff"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.9"/>
  <path d="M35.5 38 L39.5 42 L35.5 46" fill="none" stroke="#6fe3ff"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.55"/>
</svg>
