<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c2" />
      <stop offset="25%" stop-color="#e2ba5e" />
      <stop offset="60%" stop-color="#9a7228" />
      <stop offset="100%" stop-color="#4d350d" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8d6e0" />
      <stop offset="50%" stop-color="#5a6875" />
      <stop offset="100%" stop-color="#1e262e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Outer L-Border with bevel -->
  <path d="M2 78 V12 Q2 2 12 2 H78 L74 6 H14 Q6 6 6 14 V74 Z" fill="url(#goldGrad)" filter="url(#shadow)" />
  <path d="M8 74 V18 Q8 8 18 8 H74 L70 12 H20 Q12 12 12 20 V70 Z" fill="url(#steelGrad)" />

  <!-- Corner Knotwork Motif -->
  <g stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <!-- Interlaced Nordic Loops -->
    <path d="M16 16 C16 32, 32 16, 32 32 C32 48, 16 32, 16 48" />
    <path d="M16 16 C32 16, 16 32, 32 32 C48 32, 32 16, 48 16" />
    <path d="M22 22 L38 38 M22 38 L38 22" stroke-width="1.2" opacity="0.6" />
    <circle cx="27" cy="27" r="14" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3 3" />
  </g>

  <!-- Corner Rivet / Boss -->
  <circle cx="9" cy="9" r="4.5" fill="#12181f" stroke="url(#goldGrad)" stroke-width="1.5" />
  <circle cx="9" cy="9" r="2" fill="#58d4ff" opacity="0.8" />
  <circle cx="71" cy="9" r="2.5" fill="#12181f" stroke="url(#goldGrad)" stroke-width="1" />
  <circle cx="9" cy="71" r="2.5" fill="#12181f" stroke="url(#goldGrad)" stroke-width="1" />
</svg>
