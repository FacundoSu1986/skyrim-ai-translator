# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "es-ES"
early_access: false
tone_instructions: "Sé conciso, técnico y constructivo. Enfócate en la arquitectura de FastAPI, React, buenas prácticas de Python asíncrono y modding de Skyrim."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
      - "draft"
    drafts: false
  path_filters:
    - "!frontend/dist/**"
    - "!frontend/node_modules/**"
    - "!output/**"
    - "!**/*.json"
    - "!**/*.lock"
    - "!**/*.txt"

chat:
  auto_reply: true
